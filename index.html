<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#13161b">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <title>Floorbound</title>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hdr-floor"><h1>Floorbound</h1></div>
    <div class="hdr-exp"><div class="meta"><b id="hdr-lvl">Lv 1 Novice</b><span id="hdr-exp-t" class="muted">0 / 0 exp</span></div><div class="track"><i id="hdr-exp"></i></div></div>
    <div class="purse"><span title="Gold"><i class="coin"></i><b id="hdr-gold">0</b></span><span title="Shards (salvage gear for them, trade them for cubes)"><i class="shard"></i><b id="hdr-shards">0</b></span><span title="Red Cubes"><i class="cube red"></i><b id="hdr-red">0</b></span><span title="Black Cubes"><i class="cube black"></i><b id="hdr-black">0</b></span></div>
  </header>
  <main>
    <section class="card" aria-label="Battle">
      <div class="floorline"><div class="hdr-floor"><b id="hdr-floor">Floor 1</b><small id="hdr-zone">Damp Cellar</small></div><span id="rest"></span></div>
      <div class="arena" style="margin-top:10px"><div class="fighter" id="you"></div><div class="fighter" id="foe"></div></div>
      <div class="controls">
        <div class="grp"><span class="muted">Floor</span><button id="fdown" data-act="floor-down" aria-label="Go down a floor">◀</button><button id="fup" data-act="floor-up" aria-label="Go up a floor">▶</button><button id="ftop" data-act="floor-top">Highest</button></div>
      </div>
      <div class="floorline"><span id="floor-prog"></span><span id="floor-max" class="muted"></span></div>
      <ul id="log" aria-live="off"></ul>
      <div class="actionbar">
        <button id="fightbtn" data-act="fight">Fight</button>
        <button id="skipbtn" data-act="skip" disabled>Skip to result</button>
      </div>
    </section>
    <section class="card" aria-label="Character">
      <nav class="tabs">
        <button data-tab="gear">Gear</button>
        <button data-tab="stats">Stats <span class="pip" id="tab-stats-pts" hidden></span></button>
        <button data-tab="skills">Skills <span class="pip" id="tab-skills-pts" hidden></span></button>
        <button data-tab="class">Class <span class="pip dot" id="tab-class-pts" hidden></span></button>
        <button data-tab="save">Save</button>
      </nav>
      <div id="panel"></div>
    </section>
  </main>
  <aside id="lootpop" class="lootpop" role="dialog" aria-label="Item found" hidden></aside>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
